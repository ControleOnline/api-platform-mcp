services:
    _defaults:
        autowire: true
        autoconfigure: true

    ControleOnline\Service\McpServerService:
        arguments:
            # A write provider must still be registered for mutation tools to be enabled.
            $readOnly: false

    ControleOnline\Service\McpBusinessTools:
        autowire: true
        autoconfigure: true

    ControleOnline\Service\McpCompanyScopeProviderInterface:
        alias: ControleOnline\Service\PeopleRoleCompanyScopeProvider

    ControleOnline\Service\PeopleRoleCompanyScopeProvider:
        autowire: true
        autoconfigure: true

    ControleOnline\EventSubscriber\McpTenantDomainSubscriber:
        autowire: true
        autoconfigure: true

    ControleOnline\Controller\McpController:
        tags: ['controller.service_arguments']

    # Chat MCP (Task type=ia) — company-scoped providers via configs
    ControleOnline\Service\McpChatService:
        autowire: true
        autoconfigure: true

    ControleOnline\Controller\McpChatController:
        tags: ['controller.service_arguments']

